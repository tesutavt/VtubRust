[package]
name = "rigrs"
version = "0.3.2"
edition = "2021"
description = "Lightweight Live2D (Cubism 4/5) face-tracked avatar viewer - educational, independent re-implementation"
license = "MIT"

[workspace]
members = [".", "vcam"]

[dependencies]
wgpu = "22.1.0"
winit = "0.30.5"
pollster = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
egui = "0.29.1"
egui-wgpu = "0.29.1"
egui-winit = { version = "0.29.1", default-features = false, features = ["clipboard", "links"] }
rfd = "0.15"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2.10", features = ["json"] }
base64 = "0.22"
sha1 = "0.10"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_UI_Input_XboxController",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
