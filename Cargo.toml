[package]
name = "rigrs"
version = "0.1.0"
edition = "2021"
description = "Lightweight Live2D (Cubism 4/5) face-tracked avatar viewer - educational, independent re-implementation"
license = "MIT"

[workspace]
members = [".", "vcam"]

[dependencies]
wgpu = "22.1.0"
winit = "0.30.5"
pollster = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
egui = "0.29.1"
egui-wgpu = "0.29.1"
egui-winit = { version = "0.29.1", default-features = false, features = ["clipboard", "links"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Media_MediaFoundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
